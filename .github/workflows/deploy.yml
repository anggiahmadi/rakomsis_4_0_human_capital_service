name: Deploy

on:
  push:
    branches: [main]

env:
  SERVICE: human_capital_service   # ganti sesuai repo/service

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        env: [dev, trial, prod]
    steps:
      - name: Deploy ke ${{ matrix.env }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.token }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GH_TOKEN
          script: |
            set -e
            cd /var/www/html/rakomsis_v_4_0/${{ matrix.env }}/${{ env.SERVICE }}
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c http.extraheader="Authorization: Basic $AUTH" pull origin main
